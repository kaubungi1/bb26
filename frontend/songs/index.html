<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>곡 리스트 - 불법이륙</title>
  <link rel="stylesheet" href="/common/tokens.css?v=4" />
  <link rel="stylesheet" href="/common/themes.css?v=4" />
  <link rel="stylesheet" href="/common/common.css?v=4" />
  <link rel="stylesheet" href="/common/peek.css?v=4" />
  <link rel="stylesheet" href="/common/profile.css?v=4" />
  <link rel="stylesheet" href="/songs/css/songs.css?v=4" />
</head>
<body>
  <header id="app-header" class="app-bar"></header>
  <div class="container songs">
    <section class="list-page">
      <!-- 합주 시트를 승계한 화면. 곡 하나가 두 줄이고, 아래 줄이 파트 여섯 칸이다. -->
      <div class="list-head">
        <div>
          <span class="overline"><span>SONG LIST</span></span>
          <h1>곡<small id="song-count"></small></h1>
        </div>
        <button type="button" class="add-link" id="add-btn">＋ 곡 등록</button>
      </div>

      <!-- 검색 · 지원 · 길드 · 태그 · 정렬을 한 줄에. 글자만 두고 누르면 아래로 메뉴가 열린다 -->
      <div class="tool-line">
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="search" id="search" class="search-box" placeholder="곡명 · 아티스트 · 사람" aria-label="곡명 · 아티스트 · 사람 검색" autocomplete="off" />
        </label>
        <div class="drop" id="drop-mine">
          <button type="button" class="drop-btn" data-drop="mine"><span id="mine-label">지원</span></button>
          <div class="drop-menu" id="menu-mine" hidden></div>
        </div>
        <div class="drop" id="drop-guild">
          <button type="button" class="drop-btn" data-drop="guild"><span id="guild-label">길드</span></button>
          <div class="drop-menu" id="menu-guild" hidden></div>
        </div>
        <div class="drop" id="drop-tag">
          <button type="button" class="drop-btn" data-drop="tag"><span id="tag-label">태그</span></button>
          <div class="drop-menu" id="menu-tag" hidden></div>
        </div>
        <div class="drop" id="drop-sort">
          <button type="button" class="drop-btn" data-drop="sort"><span id="sort-label">최신</span><i id="sort-dir">▼</i></button>
          <div class="drop-menu" id="menu-sort" hidden></div>
        </div>
      </div>

      <!-- 곡 등록·수정 폼은 common/songedit.js 의 모달이 맡는다 -->

      <div id="bump-slot"></div>
      <div id="song-list" class="song-list"></div>
    </section>
  </div>
  <!-- 좁은 칸을 여는 법: 마우스는 올려놓기, 손가락은 길게 누르기 -->
  <p class="peek-hint">칸을 <b>길게 누르면</b> 지원자 전체가 보입니다. 짧게 누르면 지원·취소입니다.</p>

  <!-- 파트 상세. 곡 정보·프로필과 같은 모달 부품을 쓴다.
       전에는 바닥에서 올라오는 시트였는데, 끌어내릴 수 없는 PC 에서도 바닥에 붙어
       버튼이 잘렸다. 창이 뜨는 방식은 사이트에 하나만 둔다. -->
  <div class="modal-backdrop" id="session-sheet" hidden>
    <div class="modal part-modal" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <h3 class="modal-title" id="sheet-title"></h3>
      <div class="part-body">
        <p class="part-sub" id="sheet-sub"></p>
        <div class="sheet-members" id="sheet-members"></div>
        <div class="sheet-actions" id="sheet-actions"></div>
      </div>
    </div>
  </div>

  <nav id="app-tabbar" class="tab-bar"></nav>
  <script src="/common/common.js?v=4"></script><script src="/common/crop.js?v=4"></script><script src="/common/profile.js?v=4"></script>
  <script src="/common/peek.js?v=4"></script>
  <!-- 소속 배지에 길드 문장을 그린다(common.js 의 guildBadge) -->
  <script src="/common/crest.js?v=4"></script>
  <script src="/common/songedit.js?v=4"></script>
  <script src="/songs/js/songs.js?v=4"></script>
</body>
</html>
