<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>곡 리스트 - 불법이륙</title>
  <link rel="stylesheet" href="/common/common.css?v=3" />
  <link rel="stylesheet" href="/songs/css/songs.css?v=3" />
</head>
<body>
  <header id="app-header" class="app-bar"></header>
  <div class="container">
    <section class="card">
      <div class="section-head">
        <h2><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg> 곡 리스트</h2>
        <div class="head-actions">
          <button type="button" class="pink add-btn-sm" id="add-btn">＋ 곡 추가</button>
        </div>
      </div>

      <!-- 검색 · 지원 · 길드 · 태그 · 정렬을 한 줄에. 글자만 두고 누르면 아래로 메뉴가 열린다 -->
      <div class="tool-line">
        <input type="search" id="search" class="search-box" placeholder="제목 · 아티스트 · 업로더 검색" autocomplete="off" />
        <div class="drop" id="drop-mine">
          <button type="button" class="drop-btn" data-drop="mine"><span id="mine-label">지원</span></button>
          <div class="drop-menu" id="menu-mine" hidden></div>
        </div>
        <div class="drop" id="drop-guild">
          <button type="button" class="drop-btn" data-drop="guild"><span id="guild-label">길드</span></button>
          <div class="drop-menu" id="menu-guild" hidden></div>
        </div>
        <div class="drop" id="drop-tag">
          <button type="button" class="drop-btn" data-drop="tag"><span id="tag-label">태그</span></button>
          <div class="drop-menu" id="menu-tag" hidden></div>
        </div>
        <div class="drop" id="drop-sort">
          <button type="button" class="drop-btn" data-drop="sort"><span id="sort-label">최신</span><i id="sort-dir">▼</i></button>
          <div class="drop-menu" id="menu-sort" hidden></div>
        </div>
      </div>

      <div id="add-form" class="form-col" hidden>
        <input id="in-title" placeholder="곡명" />
        <input id="in-artist" placeholder="아티스트" />
        <input id="in-youtube" placeholder="유튜브 URL (선택)" />
        <div class="role-picker">
          <span class="role-picker-label">태그</span>
          <div class="chip-set" id="tag-toggles"></div>
        </div>
        <div class="role-picker" id="guild-picker-row">
          <span class="role-picker-label">소속</span>
          <div class="chip-set" id="guild-toggles"></div>
        </div>
        <div class="role-picker">
          <span class="role-picker-label">세션</span>
          <div class="role-toggles" id="role-toggles"></div>
        </div>
        <div class="form-actions">
          <button type="button" class="pink" id="save-btn">추가</button>
          <button type="button" class="secondary" id="close-btn">닫기</button>
        </div>
      </div>

      <div id="bump-slot"></div>
      <div id="song-list" class="song-list"></div>
    </section>
  </div>

  <div class="sheet-backdrop" id="session-sheet" hidden>
    <div class="sheet">
      <div class="sheet-grip"></div>
      <h3 class="sheet-title" id="sheet-title"></h3>
      <p class="sheet-sub" id="sheet-sub"></p>
      <div class="sheet-members" id="sheet-members"></div>
      <div class="sheet-actions" id="sheet-actions"></div>
    </div>
  </div>

  <nav id="app-tabbar" class="tab-bar"></nav>
  <script src="/common/common.js?v=3"></script>
  <script src="/songs/js/songs.js?v=3"></script>
</body>
</html>
