<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>멤버 - 불법이륙</title>
  <link rel="stylesheet" href="/common/tokens.css?v=4" />
  <link rel="stylesheet" href="/common/themes.css?v=4" />
  <link rel="stylesheet" href="/common/common.css?v=4" />
  <link rel="stylesheet" href="/common/profile.css?v=4" />
  <link rel="stylesheet" href="/members/css/members.css?v=4" />
</head>
<body>
  <header id="app-header" class="app-bar"></header>
  <main class="container members">
    <section class="card">
      <!-- 머리 문법은 곡·일정 페이지와 같다. 아이콘도 채운 버튼도 두지 않는다. -->
      <div class="list-head">
        <div>
          <span class="overline"><span>MEMBERS</span></span>
          <h1>멤버<small id="member-count"></small></h1>
        </div>
        <button id="edit-me" type="button" class="add-link">내 캐릭터</button>
      </div>

      <label class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="member-search" type="search" placeholder="닉네임 · 소개 · 길드 검색" aria-label="멤버 검색" autocomplete="off" />
      </label>
      <div id="role-filter" class="chip-set member-filters" role="group" aria-label="파트별 보기"></div>
      <p id="member-error" class="form-error" role="alert" hidden></p>
      <div id="member-list" class="member-list"></div>
    </section>
  </main>
  <nav id="app-tabbar" class="tab-bar"></nav>
  <script src="/common/common.js?v=4"></script>
  <script src="/common/crop.js?v=4"></script><script src="/common/profile.js?v=4"></script>
  <script src="/members/js/members.js?v=4"></script>
</body>
</html>
