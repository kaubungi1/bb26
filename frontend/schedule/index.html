<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>일정 - 불법이륙</title>
  <link rel="stylesheet" href="/common/tokens.css?v=4" />
  <link rel="stylesheet" href="/common/themes.css?v=4" />
  <link rel="stylesheet" href="/common/common.css?v=4" />
  <link rel="stylesheet" href="/common/profile.css?v=4" />
  <link rel="stylesheet" href="/common/peek.css?v=4" />
  <link rel="stylesheet" href="/common/stage.css?v=4" />
  <link rel="stylesheet" href="/common/eventcard.css?v=4" />
  <link rel="stylesheet" href="/schedule/css/schedule.css?v=4" />
</head>
<body>
  <header id="app-header" class="app-bar"></header>
  <div class="container schedule">
    <!-- 달력은 두지 않는다. 한 달에 일정이 아홉 건이라 서른 칸 중 스물두 칸이 빈다.
         날짜순이 이미 정해져 있어 목록이 달력보다 조밀하고 읽기 쉽다. -->
    <section class="card" id="polls-card">
      <!-- 머리 문법은 곡 페이지(.list-head)와 같다. 아이콘도 채운 버튼도 두지 않는다. -->
      <div class="list-head">
        <div>
          <span class="overline"><span>SCHEDULE</span></span>
          <h1>모임 · 일정<small id="event-count"></small></h1>
        </div>
        <!-- 만들 수 있는 종류가 있을 때만 보인다(schedule.js allowedKinds). 판정 전에는 숨겨 둔다 -->
        <button type="button" class="add-link" id="add-poll-btn" hidden>＋ 일정 추가</button>
      </div>
      <div id="poll-list" class="poll-list"></div>
    </section>

    <section class="card" id="past-card" hidden>
      <div class="section-head">
        <h2>지난 합주</h2>
      </div>
      <div id="past-list" class="poll-list"></div>
    </section>
  </div>

  <div class="modal-backdrop" id="add-modal" hidden>
    <div class="modal">
      <h3 class="modal-title" id="add-title">＋ 일정 후보 만들기</h3>
      <p class="modal-desc">후보 기간을 정하면 날짜별 참석 가능 여부 선택 가능합니다.</p>
      <form id="add-form" class="modal-form">
        <!-- 일정 종류. 정기합주·정기공연은 관리자에게만 보인다. 길드 페이지에서는 길드 합주로 고정이라 숨는다 -->
        <div class="dow-pick kind-pick" id="kind-pick" role="radiogroup" aria-label="일정 종류">
          <span class="dow-pick-label">종류</span>
          <span class="kind-fixed" id="kind-fixed" hidden></span>
          <button type="button" data-kind="regular">정기합주</button>
          <button type="button" data-kind="concert">정기공연</button>
          <button type="button" data-kind="guild">길드 합주</button>
          <button type="button" data-kind="band">밴드 행사</button>
        </div>
        <!-- 정기합주·정기공연의 참가 길드. 여러 개 고른다 -->
        <div class="dow-pick guild-pick" id="guild-pick" role="group" aria-label="참가 길드" hidden></div>
        <input id="in-title" placeholder="일정 제목 (예: 10월 주말 정기합주)" required />
        <div class="range-row">
          <input type="date" id="in-from" required />
          <span class="range-tilde">~</span>
          <input type="date" id="in-to" required />
        </div>
        <!-- 요일을 고르면 그 요일만 후보가 된다. 아무것도 안 고르면 기간 안 모든 날이다.
             주말 정기합주는 토·일만 고르면 10/3~10/31 이 29일이 아니라 9일이 된다. -->
        <div class="dow-pick" id="dow-pick" role="group" aria-label="후보 요일">
          <span class="dow-pick-label">요일</span>
          <button type="button" data-dow="0">일</button>
          <button type="button" data-dow="1">월</button>
          <button type="button" data-dow="2">화</button>
          <button type="button" data-dow="3">수</button>
          <button type="button" data-dow="4">목</button>
          <button type="button" data-dow="5">금</button>
          <button type="button" data-dow="6">토</button>
          <span class="dow-pick-hint" id="dow-hint">전체</span>
        </div>
        <input id="in-note" placeholder="메모 (선택)" />
        <button type="submit" class="pink">후보 생성</button>
        <button type="button" class="ghost" id="add-cancel">취소</button>
      </form>
    </div>
  </div>

  <!-- 일정 상세. 전체화면으로 덮지 않고 목록에서 펼친다.
       이 덩어리는 한 벌뿐이고, 펼친 항목 안으로 옮겨 다닌다. 다시 만들지 않으므로
       입력 중이던 값과 불러온 곡 목록이 그대로 남는다. 닫히면 아래 보관함으로 돌아온다. -->
  <div id="poll-park" hidden>
    <div id="poll-detail" class="poll-detail">
      <div class="poll-detail-head">
        <span id="poll-meta" class="muted"></span>
        <button type="button" class="ghost" id="poll-delete">삭제</button>
      </div>
      <!-- 확정 요약. 펼치면 맨 위에서 '언제·어디서·누가' 를 답한다(2026-10-02).
           전에는 맨 위 한 줄과 날짜 표 아래 확정 띠에 같은 정보가 두 번 있었고, 참석자는 표에서 세야 했다 -->
      <div class="confirmed-bar" id="confirmed-bar" hidden>
        <div class="confirmed-main">
          <div class="confirmed-info">
            <span class="confirmed-badge"><span>확정</span></span>
            <span id="confirmed-detail"></span>
          </div>
          <div class="confirmed-people" id="confirmed-people"></div>
        </div>
        <div class="confirmed-actions">
          <button type="button" class="add-link" id="add-member-btn">＋ 인원 추가</button>
          <!-- 수정·확정 해제는 다룰 수 있는 사람에게만 보인다(schedule.js canManage) -->
          <button type="button" class="ghost" id="edit-event-btn">수정</button>
          <button type="button" class="ghost" id="unconfirm-btn">확정 해제</button>
          <button type="button" class="ghost" id="confirmed-delete">삭제</button>
        </div>
      </div>
      <!-- 확정 일정 정보 고치기. 날짜는 참석 투표와 묶여 있어 확정 해제로만 바꾼다 -->
      <form class="event-edit" id="event-edit" hidden>
        <input id="ee-title" maxlength="60" placeholder="제목" aria-label="제목" />
        <div class="confirm-row">
          <input type="time" id="ee-start" aria-label="시작" />
          <input type="time" id="ee-end" aria-label="종료" />
          <input id="ee-place" maxlength="80" placeholder="장소" aria-label="장소" />
        </div>
        <input id="ee-note" maxlength="300" placeholder="메모 (선택)" aria-label="메모" />
        <div class="confirm-row">
          <button type="submit" class="pink" id="ee-save">저장</button>
          <button type="button" class="ghost" id="ee-cancel">취소</button>
        </div>
      </form>
      <!-- 정기합주·정기공연의 참가 길드. 관리자는 여기서 고친다(확정 뒤에도) -->
      <div class="poll-guilds" id="poll-guilds" hidden></div>

      <!-- 확정된 일정의 날짜 투표 기록은 접어 둔다. 끝난 투표가 화면 한 장 반을 차지했다 -->
      <button type="button" class="vote-toggle" id="vote-toggle" aria-expanded="false" hidden>날짜 투표 기록 보기</button>
      <div id="vote-box">
      <div class="poll-toolbar">
        <label class="chk"><input type="checkbox" id="weekend-only" /> 주말만</label>
        <span id="poll-hint" class="muted"></span>
      </div>
      <div id="matrix" class="matrix-wrap"></div>
      </div>

      <!-- 확정 칸은 날짜 표 바로 아래다. 전에는 되는 곡 목록 뒤에 있어서 곡이 많으면 한참 내려가야 했다. -->
      <div class="confirm-bar" id="confirm-bar">
        <div class="confirm-row">
          <select id="confirm-date" class="confirm-select"></select>
          <input type="time" id="confirm-start" placeholder="시작" />
          <input type="time" id="confirm-end" placeholder="종료" />
        </div>
        <div class="confirm-row">
          <input id="confirm-place" placeholder="장소 (선택)" />
          <button type="button" class="pink" id="confirm-btn">이 날짜로 확정</button>
        </div>
      </div>


      <!-- 확정 후: 그날 하는 곡과 라인업 -->
      <section class="ps-section" id="setlist-section" hidden>
        <div class="ps-head">
          <h3 class="ps-title">셋리스트</h3>
          <span class="muted" id="setlist-hint">아래 표에서 ＋ 를 눌러 곡을 넣으세요</span>
        </div>
        <div id="setlist" class="setlist"></div>
      </section>

      <!-- 조율 중엔 후보 날짜별로, 확정 후엔 확정일 기준으로.
           넓은 화면에서는 왼쪽이 곡 목록, 오른쪽이 합주실이다. -->
      <section class="ps-section" id="playable-section" hidden>
        <div class="ps-head">
          <h3 class="ps-title" id="ps-title">이 날이면 되는 곡</h3>
          <!-- 길드 일정에서만 보인다. 이 길드 곡만 / 사이트 전체 곡 -->
          <span class="ps-scope" id="ps-scope" role="group" aria-label="곡 범위" hidden>
            <button type="button" class="chip" data-scope="guild">이 길드 곡</button>
            <button type="button" class="chip" data-scope="all">전체</button>
          </span>
          <!-- 곡이 수백이라 찾을 길이 필요하다. 받은 목록 안에서만 거른다(서버를 다시 부르지 않는다) -->
          <input type="search" class="ps-search" id="ps-search" placeholder="곡·아티스트·사람" aria-label="되는 곡 검색" />
          <button type="button" class="ghost" id="ps-toggle">전체 보기</button>
        </div>
        <div class="ps-dates" id="ps-dates"></div>
        <div class="ps-split">
          <div class="ps-wrap" id="playable-list"></div>
          <div class="ps-stage" id="playable-stage"></div>
        </div>
      </section>

    </div>
  </div>

  <nav id="app-tabbar" class="tab-bar"></nav>
  <script src="/common/common.js?v=4"></script><script src="/common/crop.js?v=4"></script><script src="/common/profile.js?v=4"></script>
  <script src="/common/peek.js?v=4"></script>
  <!-- 소속 배지에 길드 문장을 그린다(common.js 의 guildBadge) -->
  <script src="/common/crest.js?v=4"></script>
  <script src="/common/eventcard.js?v=4"></script>
  <script src="/common/stage.js?v=4"></script>
  <script src="/schedule/js/schedule.js?v=4"></script>
</body>
</html>
